apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  # Omitted entirely when the HPA is on, so the two do not fight over the
  # field on every reconcile.
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flux.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "flux.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        flux.config/checksum: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        # The worker asks to be scraped rather than the collector being told
        # about it, so nothing outside this chart has to know how flux's
        # deployments are named. Per pod, not through a Service: a worker has
        # none by design, and a ClusterIP would round-robin between replicas
        # whose counters are independent of each other.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      # The Temporal SDK installs its own SIGTERM handler and drains, but
      # draining means handing in-flight tasks back to the queue rather than
      # finishing them, so this period is never reached (measured in D58: gone
      # in under a second against 30). The canary continues on whichever worker
      # picks the task up, which is D27's proof triggered by the orchestrator.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      # flux needs no privileges, and D46 already found it needs no RBAC either.
      # This is the same claim from the kernel's side: no root, no capabilities,
      # no writable image, nothing to escalate into.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 9464
          env:
            - name: FLUX_CONFIG
              value: /etc/flux/flux.config.toml
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            {{- with .Values.observability.otlpEndpoint }}
            - name: OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.environment }}
            - name: FLUX_ENV
              value: {{ . | quote }}
            {{- end }}
            # The canary's target, not this pod's own health.
            - name: HEALTH_URL
              value: {{ .Values.health.url | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/flux
              readOnly: true
          # No HTTP probe: a Temporal worker has no inbound traffic, so
          # readiness would mean nothing to route. `/metrics` answering is the
          # honest liveness signal: the process is up and its runtime is
          # serving. Whether it can reach Temporal is the *server's* problem to
          # notice, through missed heartbeats, and it already does.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          # A read-only root filesystem still has to leave somewhere for the
          # runtime's scratch files.
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.worker.autoscaling.metrics }}
    {{- toYaml .Values.worker.autoscaling.metrics | nindent 4 }}
    {{- else }}
    # CPU because it needs nothing installed. The metric that actually fits a
    # Temporal worker is the task-queue backlog, which flux already reads over
    # raw gRPC (D34), but reaching an HPA takes three steps flux has not
    # taken: publish it as a gauge on /metrics, scrape it, and expose it
    # through a custom-metrics adapter. Override `metrics` once they exist.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
spec:
  # A node drain during a canary is the interesting case: without this both
  # workers can go at once and the canary waits for a replacement rather than
  # continuing on the survivor.
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flux.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
