apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  # Omitted entirely when the HPA is on, so the two do not fight over the
  # field on every reconcile.
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flux.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "flux.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        flux.config/checksum: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      # The knob this whole tier exists to study. The Temporal SDK installs its
      # own SIGTERM handler and drains, so a grace period longer than the
      # in-flight activity lets the worker finish and exit clean; a shorter one
      # ends in SIGKILL, the server notices the missed heartbeats, and another
      # worker resumes the canary. That is D27's proof, triggered by the
      # orchestrator instead of by hand.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9464
          env:
            - name: FLUX_CONFIG
              value: /etc/flux/flux.config.toml
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            # The canary's target, not this pod's own health.
            - name: HEALTH_URL
              value: {{ .Values.health.url | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/flux
              readOnly: true
          # No HTTP probe: a Temporal worker has no inbound traffic, so
          # readiness would mean nothing to route. `/metrics` answering is the
          # honest liveness signal: the process is up and its runtime is
          # serving. Whether it can reach Temporal is the *server's* problem to
          # notice, through missed heartbeats, and it already does.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.worker.autoscaling.metrics }}
    {{- toYaml .Values.worker.autoscaling.metrics | nindent 4 }}
    {{- else }}
    # CPU because it needs nothing installed. The metric that actually fits a
    # Temporal worker is the task-queue backlog, which flux already reads over
    # raw gRPC (D34), but reaching an HPA takes three steps flux has not
    # taken: publish it as a gauge on /metrics, scrape it, and expose it
    # through a custom-metrics adapter. Override `metrics` once they exist.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "flux.labels" . | nindent 4 }}
spec:
  # A node drain during a canary is the interesting case: without this both
  # workers can go at once and the canary waits for a replacement rather than
  # continuing on the survivor.
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "flux.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
