# flux on Kubernetes. A laboratory rather than a distribution (D40).
#
# The point is to watch a durable deployment system behave when the orchestrator
# underneath it can evict its processes. Nothing here changes how flux shifts
# traffic: it still drives Caddy itself.

image:
  worker:
    repository: flux-worker
    tag: dev
    pullPolicy: IfNotPresent
  controlPlane:
    repository: flux-control-plane
    tag: dev
    pullPolicy: IfNotPresent

temporal:
  address: temporal:7233
  namespace: default

controlPlane:
  # Anything else the control plane should be handed.
  # `MAX_CONCURRENT_DEPLOYMENTS` is the one worth knowing about: it is the
  # admission budget (D14), and at its default of 10 it caps the load well
  # below what two workers hold, so the queue never builds and the backlog HPA
  # can never fire (D63/D64). Raising it is the honest way to exercise
  # autoscaling, rather than constraining the workers.
  extraEnv: {}
  # Not configurable, and that is the finding rather than an omission (D40):
  # admission control is an in-memory STM budget and the read model is a local
  # SQLite file, so a second replica means a second budget, a second projection
  # and a second poller querying every running workflow. One replica.
  service:
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

worker:
  replicas: 2
  # Measured, and it does not bind (D58). The guess written here first was that
  # a long grace lets a draining worker finish its in-flight activity and a
  # short one gets it SIGKILLed. Neither happens: with one worker holding a
  # monitor activity for certain, the pod is gone in under a second at a 30
  # second grace, because the SDK hands the task back to the queue rather than
  # finishing it, and another worker picks it up. Kept at 30 as headroom for a
  # shutdown path that might one day need it, not as a tuned value.
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 768Mi }
  # Anything else the worker should be handed. `TEMPORAL_METRICS_PORT` is the
  # one that earns its keep: it binds the SDK core's own Prometheus exporter,
  # which is the only place a worker's *slots* are visible. `WorkerStatus`
  # reports what is in flight, never what the resource tuner is currently
  # willing to admit, and `temporal_resource_slots_mem_pid_output` is that
  # decision rather than its consequence.
  #
  # `FLUX_WORKER_BUILD_ID` is the one to be careful with, because setting it is
  # a migration rather than a setting. It turns on Worker Deployment Versioning,
  # and the first poll writes a version into Temporal that outlives these pods,
  # this release, and the cluster. Two consequences neither Kubernetes nor Helm
  # will warn you about:
  #
  #   1. A rolling update strands in-flight work. Executions are PINNED to the
  #      build that started them, so replacing every pod at once removes the
  #      only workers allowed to run them. They do not fail; they stop, and
  #      their status queries stop being answerable, until a worker on that
  #      build returns. Roll one build at a time, or accept the pause.
  #
  #   2. Removing this value does not turn versioning off. Temporal keeps
  #      routing the task queue to the last current version, so unversioned
  #      workers become invisible to it: pods Ready, probes green, pollers
  #      polling, and nothing running at all. The server is the only place that
  #      knows. See deploy/kubernetes/README.md for how to check and undo it.
  extraEnv: {}

  podDisruptionBudget:
    enabled: true
    # A voluntary eviction during a canary is the interesting case, so keep one
    # worker up through a node drain rather than letting both go at once.
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    # CPU because it needs nothing extra installed. The metric that would
    # actually fit is the task-queue backlog flux already reads over gRPC
    # (D34), but that is three steps away, not one: the worker does not
    # publish it as a gauge yet, Prometheus would then have to scrape it, and
    # an HPA can only read it through a custom-metrics adapter. Set
    # `metrics` below to drive it from something else once those exist.
    targetCPUUtilizationPercentage: 70
    metrics: []

# flux drives the router itself. Caddy rather than nginx, and not by taste:
# the nginx adapter writes a config file and signals a process, so it assumes
# the worker and nginx share a filesystem and a process namespace. Caddy's
# admin API crosses pods, so it is a Deployment and a Service (D40, D44).
router:
  type: caddy
  adminUrl: http://caddy:2019
  serverName: flux
  # No backend port here on purpose: flux's own `backendAddress` is fixed at
  # `<service>-<version>:8080`, so it is the lab's Services that have to match
  # it. A value here would only be able to lie about it.

metrics:
  type: prometheus
  prometheusUrl: http://prometheus:9090

thresholds:
  maxErrorRate: 0.01
  maxP99LatencyMs: 500

# Health probing for the canary's target, not for flux's own pods.
health:
  url: http://demo-target:80/health

# Empty by default: flux degrades rather than failing when these are absent
# (no key means no postmortem call, and no token means auth is off).
secrets:
  anthropicApiKey: ""
  slackWebhook: ""
  githubToken: ""
  apiToken: ""

# Where spans go, and what they are labelled with. An empty endpoint means no
# export at all rather than a guess: the apps used to default to
# `localhost:4318`, which inside a pod is the pod itself.
observability:
  otlpEndpoint: "http://jaeger:4318"
  environment: "k3d-lab"

# What flux is allowed to reach, which is the network side of a claim the chart
# makes twice already: no RBAC (D46), no root or capabilities (D56). The list is
# the claim, so it is written out rather than inferred: anything absent from it
# is denied.
#
# Labels differ per dependency because this lab's manifests are not uniform
# (`app:` for Temporal and Prometheus, `app.kubernetes.io/component:` for the
# router), so they are values rather than something the template guesses.
networkPolicy:
  enabled: true
  # The namespace label CoreDNS lives under. `kubernetes.io/metadata.name` is
  # set automatically on every namespace since 1.21.
  dnsNamespace: kube-system
  worker:
    port: 9464
    egress:
      - podLabels: { app: temporal }
        ports: [7233]
      - podLabels: { app: prometheus }
        ports: [9090]
      - podLabels: { app.kubernetes.io/component: caddy }
        ports: [2019]
      # The deployment target's health endpoint.
      - podLabels: { app: demo-target }
        ports: [80, 8080]
      - podLabels: { app.kubernetes.io/name: jaeger }
        ports: [4318]
  controlPlane:
    port: 8080
    egress:
      - podLabels: { app: temporal }
        ports: [7233]
      - podLabels: { app.kubernetes.io/name: jaeger }
        ports: [4318]
