packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

# effect v4 is a fast-moving beta, so pin it exact and bump on purpose.
catalog:
  effect: 4.0.0-rc.113
  "@effect/platform-node": 4.0.0-rc.113
  "@effect/sql-sqlite-node": 4.0.0-rc.113
  "@effect/vitest": 4.0.0-rc.113
  "@effect/opentelemetry": 4.0.0-rc.113
  "@temporalio/activity": ^1.23.0
  "@temporalio/client": ^1.23.0
  "@temporalio/common": ^1.23.0
  "@temporalio/nexus": ^1.23.0
  "@temporalio/testing": ^1.23.0
  "@temporalio/worker": ^1.23.0
  "@temporalio/workflow": ^1.23.0
  "nexus-rpc": ^0.0.3
  "@types/node": ^24.13.3
  typescript: ^7.0.2
  tsx: ^4.19.0
  vitest: ^5.0.0
  # effect rc ships zero dependencies and no longer re-exports FastCheck from
  # effect/testing, so the property-based domain tests depend on it directly.
  "fast-check": ^4.10.0

minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.27.8
  - tsdown@0.22.7
  - fast-check@4.10.0
