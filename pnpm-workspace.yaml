packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

# effect v4 is a fast-moving beta, so pin it exact and bump on purpose.
catalog:
  effect: 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-beta.102
  "@effect/sql-sqlite-node": 4.0.0-beta.102
  "@effect/vitest": 4.0.0-beta.102
  "@effect/opentelemetry": 4.0.0-beta.102
  "@temporalio/activity": ^1.23.0
  "@temporalio/client": ^1.23.0
  "@temporalio/common": ^1.23.0
  "@temporalio/nexus": ^1.23.0
  "@temporalio/testing": ^1.23.0
  "@temporalio/worker": ^1.23.0
  "@temporalio/workflow": ^1.23.0
  "nexus-rpc": ^0.0.3
  "@types/node": ^24.13.3
  typescript: ^7.0.2
  tsx: ^4.19.0
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.27.8
  - tsdown@0.22.7

# The proto3-json-serializer override that lived here is gone. SDK 1.23 moved
# historyToJSON/historyFromJSON onto protobufjs v8's own protojson and dropped
# the dependency outright, which is the condition the old note set for removal.
# The committed replay fixtures still parse and replay green. Measured what a
# re-capture actually changes in the encoding, and it is one thing: a map
# holding its default value is no longer emitted, so the started event's empty
# `header.fields` disappears. A non-empty header still round-trips
# (tracing.test.ts covers it). Everything else that moves on a re-capture is
# the workflow having gained events since, not the codec.
