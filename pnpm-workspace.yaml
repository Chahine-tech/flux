packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true

# effect v4 is a fast-moving beta, so pin it exact and bump on purpose.
catalog:
  effect: 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-beta.102
  "@effect/sql-sqlite-node": 4.0.0-beta.102
  "@effect/vitest": 4.0.0-beta.102
  "@effect/opentelemetry": 4.0.0-beta.102
  "@temporalio/activity": ^1.21.1
  "@temporalio/client": ^1.21.1
  "@temporalio/common": ^1.21.1
  "@temporalio/nexus": ^1.21.1
  "@temporalio/testing": ^1.21.1
  "@temporalio/worker": ^1.21.1
  "@temporalio/workflow": ^1.21.1
  "nexus-rpc": ^0.0.2
  "@types/node": ^24.13.3
  typescript: ^7.0.2
  tsx: ^4.19.0
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.27.8
  - tsdown@0.22.7

# historyToJSON (used to capture the replay fixtures) only works with
# proto3-json-serializer 2.0.0: 2.0.1+ throws on bytes map values before the
# SDK can fix them up — documented in @temporalio/common's own proto-utils
# (googleapis/proto3-json-serializer-nodejs#103). Scoped to the one package
# that needs it; remove once the Temporal SDK pins or fixes this itself.
overrides:
  "@temporalio/common>proto3-json-serializer": 2.0.0