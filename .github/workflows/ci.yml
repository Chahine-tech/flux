name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run typecheck test

      # The chart, without a cluster. `helm template` against every values file
      # catches the things that actually break it: a mistrimmed `-}}` gluing
      # two keys together, a self-including checksum annotation recursing, and
      # costs seconds. Whether it *runs* is the `kubernetes` job's question.
      - name: Chart renders
        run: |
          helm lint deploy/kubernetes/chart
          helm template flux deploy/kubernetes/chart > /tmp/rendered.yaml
          helm template flux deploy/kubernetes/chart --set worker.autoscaling.enabled=false >> /tmp/rendered.yaml
          helm template flux deploy/kubernetes/chart --set router.type=nginx >> /tmp/rendered.yaml
          python3 -c "import sys, yaml; list(yaml.safe_load_all(open('/tmp/rendered.yaml'))); print('rendered YAML parses')"

      # The hardening is a claim the chart makes about flux ("it needs no root,
      # no capabilities and no writable image"), and claims that nothing checks
      # come undone quietly. Rendering is the cheapest place to hold it.
      - name: The chart still refuses to run flux privileged
        run: |
          helm template flux deploy/kubernetes/chart > /tmp/hardening.yaml
          python3 - <<'PY'
          import yaml
          required = {"flux-worker", "flux-control-plane"}
          seen = set()
          for doc in yaml.safe_load_all(open("/tmp/hardening.yaml")):
              if not doc or doc.get("kind") != "Deployment":
                  continue
              name = doc["metadata"]["name"]
              if name not in required:
                  continue
              seen.add(name)
              spec = doc["spec"]["template"]["spec"]
              pod = spec.get("securityContext", {})
              assert pod.get("runAsNonRoot") is True, f"{name}: runAsNonRoot"
              assert pod.get("seccompProfile", {}).get("type") == "RuntimeDefault", f"{name}: seccomp"
              for container in spec["containers"]:
                  sec = container.get("securityContext", {})
                  assert sec.get("readOnlyRootFilesystem") is True, f"{name}: readOnlyRootFilesystem"
                  assert sec.get("allowPrivilegeEscalation") is False, f"{name}: allowPrivilegeEscalation"
                  assert sec.get("capabilities", {}).get("drop") == ["ALL"], f"{name}: capabilities"
          assert seen == required, f"missing deployments: {required - seen}"
          print("both flux deployments are non-root, unprivileged and read-only")
          PY

      # The network side of the same claim. An egress allow-list is only a claim
      # while something checks it, and the way these break is silent: a missing
      # DNS rule leaves every destination unresolvable while the policy still
      # renders perfectly.
      - name: The chart still fences flux's egress
        run: |
          helm template flux deploy/kubernetes/chart > /tmp/netpol.yaml
          python3 - <<'PY'
          import yaml
          policies = {
              d["metadata"]["name"]: d
              for d in yaml.safe_load_all(open("/tmp/netpol.yaml"))
              if d and d.get("kind") == "NetworkPolicy"
          }
          assert set(policies) == {"flux-worker", "flux-control-plane"}, policies.keys()
          for name, policy in policies.items():
              spec = policy["spec"]
              assert set(spec["policyTypes"]) == {"Ingress", "Egress"}, name
              rules = spec["egress"]
              dns = [r for r in rules if any(p.get("port") == 53 for p in r.get("ports", []))]
              assert dns, f"{name}: no DNS egress, every destination would fail to resolve"
              assert len(rules) > 1, f"{name}: DNS only, nothing else reachable"
          print("both flux deployments have a fenced egress that still resolves names")
          PY

      # Built once, here, and handed to every job that needs it. The images
      # assemble a build rather than producing one, so three jobs were each
      # running the same `pnpm install` and the same tsdown pass to produce
      # byte-identical output. This is also the right gate: a build that fails
      # its own typecheck and tests should never reach a cluster.
      - name: Build what the images assemble
        run: |
          pnpm --filter @flux/worker build
          pnpm --filter @flux/worker bundle-workflows
          pnpm --filter @flux/worker runtime-manifest
          pnpm --filter @flux/control-plane build
          pnpm --filter @flux/control-plane runtime-manifest

      # Two paths whose least common ancestor is `apps/`, so the artifact holds
      # `worker/dist` and `control-plane/dist` and consumers unpack it into
      # `apps/`. The consumers assert that rather than trust it.
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: |
            apps/worker/dist
            apps/control-plane/dist
          retention-days: 1
          if-no-files-found: error


  # The images are the only artifacts nothing else in the repo exercises, so
  # they are the only ones that can rot silently. Building them is cheap; the
  # smoke check is what gives it teeth, because it loads every runtime
  # dependency and so covers the two ways these images have actually broken:
  # a dependency left out of the runtime manifest (the app bundle externalises
  # more than `neverBundle`), and a base image whose libc cannot dlopen
  # Temporal's prebuilt core-bridge.
  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [worker, control-plane]
    steps:
      - uses: actions/checkout@v4

      # No Node and no pnpm here, which is the point: the image assembles a
      # build it is handed. A version of this job installed the workspace to
      # produce that build itself and failed with `pnpm: command not found`,
      # having been given the work without the toolchain.
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: apps

      - name: The build landed where the Dockerfile looks
        run: |
          for f in apps/${{ matrix.app }}/dist/main.mjs apps/${{ matrix.app }}/dist/runtime-package.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing, so the artifact did not unpack where expected"
              find apps -maxdepth 3 -name dist -type d
              exit 1
            fi
          done
          ls -l apps/${{ matrix.app }}/dist

      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t flux-${{ matrix.app }}:ci .

      - name: Runtime dependencies load inside the image
        run: |
          docker run --rm --entrypoint node flux-${{ matrix.app }}:ci --input-type=module -e '
            const fs = await import("node:fs/promises")
            const { dependencies } = JSON.parse(await fs.readFile("/srv/package.json", "utf8"))
            for (const name of Object.keys(dependencies)) await import(name)
            console.log("resolved:", Object.keys(dependencies).join(", "))
          '


  # The one thing a cluster is for: a canary surviving its worker being evicted
  # by the orchestrator (D40). Everything else about the chart is settled by
  # `helm template` in the fast job, so this job asserts the behaviour that has
  # no cheaper proof.
  #
  # k3d rather than kind because k3d is what this was developed and verified
  # against locally, and it ships metrics-server, which the HPA needs and a
  # bare kind cluster does not have.
  kubernetes:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # This job installs the workspace where `images` does not, because the
      # eviction proof is a vitest test and needs a runnable workspace. The
      # build itself still comes from `check`.
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: apps

      - name: The build landed where the Dockerfiles look
        run: |
          for f in apps/worker/dist/main.mjs apps/worker/dist/workflow-bundle.js \
                   apps/control-plane/dist/main.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing, so the artifact did not unpack where expected"
              find apps -maxdepth 3 -name dist -type d
              exit 1
            fi
          done

      - run: |
          docker build -f apps/worker/Dockerfile -t flux-worker:dev .
          docker build -f apps/control-plane/Dockerfile -t flux-control-plane:dev .

      # k3d from its own installer rather than a third-party action: the
      # obvious one has not been touched since 2023, and these are the exact
      # commands this was verified with locally. `helm` and `kubectl` come with
      # the runner image.
      - name: k3d cluster
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version
          k3d cluster create flux-lab --wait --timeout 300s
          kubectl get nodes

      - run: k3d image import flux-worker:dev flux-control-plane:dev -c flux-lab

      - name: Lab dependencies
        run: |
          kubectl apply -f deploy/kubernetes/deps/
          kubectl wait --for=condition=available --timeout=300s deployment/postgresql deployment/temporal deployment/prometheus deployment/demo-target deployment/demo-metrics
          kubectl wait --for=condition=complete --timeout=300s job/temporal-namespace

      - run: helm install flux deploy/kubernetes/chart --wait --timeout 300s

      # Discovery by annotation breaks silently: a renamed label or a mistyped
      # port leaves Prometheus with nothing to say and no error anywhere. So
      # the assertion is that it found both workers, not that the manifests
      # parse.
      - name: Prometheus scrapes both workers
        run: |
          kubectl port-forward svc/prometheus 19090:9090 >/dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:19090/-/ready >/dev/null && break
            sleep 2
          done
          for i in $(seq 1 60); do
            up=$(curl -s 'http://localhost:19090/api/v1/targets?state=active' \
              | python3 -c 'import json,sys; print(len([t for t in json.load(sys.stdin)["data"]["activeTargets"] if t["labels"].get("component")=="worker" and t["health"]=="up"]))')
            [ "$up" -ge 2 ] && { echo "prometheus is scraping $up workers"; exit 0; }
            sleep 3
          done
          echo "::error::prometheus never discovered the flux workers"
          curl -s 'http://localhost:19090/api/v1/targets?state=active' | head -c 2000
          exit 1

      # The plumbing is the job's, the assertion is the test's, same split as
      # the compose tier.
      #
      # All in one step, and supervised. The chart gives the control plane a
      # ClusterIP, so a port-forward is the only way in, and an unsupervised
      # `&` that never came up or died mid-run would show up as unexplained
      # fetch failures inside the test rather than as the infrastructure
      # problem it is. Actions grew a native `background:` step marker for this
      # in June 2026, but it is not in the workflow syntax reference yet and an
      # unknown step key fails validation for the whole file, so this stays
      # shell until it is documented.
      - name: A canary survives its worker being evicted
        run: |
          # `set -m` so the supervisor becomes its own process group leader and
          # the trap can take the whole group down. Killing just the subshell
          # leaves the `kubectl` it spawned orphaned and still holding the port.
          set -m
          ( while true; do
              # `|| true` is load-bearing: Actions runs `bash -e`, the subshell
              # inherits it, and without this the supervisor dies the first
              # time the forward exits nonzero, which is the one case it is
              # here for.
              kubectl port-forward svc/flux-control-plane 18080:8080 >/dev/null 2>&1 || true
              sleep 1
            done ) &
          forward=$!
          set +m
          trap 'kill -- -"$forward" 2>/dev/null || true' EXIT

          # `/health/live`, not `/health/ready`, and the difference is D45's
          # whole point: this is asking whether the network path works.
          # Readiness is the test's own precondition and the test polls for it.
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:18080/health/live >/dev/null; then
              echo "control plane reachable after ${i}s"
              reachable=1
              break
            fi
            sleep 1
          done
          if [ -z "${reachable:-}" ]; then
            echo "::error::nothing answered on localhost:18080 after 60s, the port-forward never came up"
            kubectl get svc,pods -o wide
            exit 1
          fi

          # Named so only the cluster test runs: `check` already ran the rest,
          # and their output here would only bury the one result that matters.
          FLUX_K8S=1 pnpm --filter @flux/worker test kubernetes

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app.kubernetes.io/name=flux | tail -60
          kubectl logs -l app.kubernetes.io/component=worker --tail=60 || true
          kubectl logs -l app.kubernetes.io/component=control-plane --tail=60 || true

  # Real-cluster proofs: worker versioning, resource tuner, Schedules:
  # the capabilities the time-skipping test server does not implement. Runs the
  # project's own compose so CI exercises exactly what developers run.
  real-temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--wait` replaces a hand-rolled poll loop that exec'd the `temporal` CLI
      # inside the server container: the `temporalio/server` image ships no CLI,
      # only `temporal-server`. It must only name long-running services, though
      # compose treats a named service that exits as a failure even when it
      # exits 0, so listing `temporal-namespace` here fails the job after
      # everything came up correctly. The one-shot runs as its own step instead,
      # where its exit code is the script's own. `run` still honours the
      # `service_healthy` dependency, so ordering is unchanged.
      # Caddy comes up too: the router adapter is the one whose shape fits a pod
      # topology (D40), and until now it had only ever driven an HTTP double.
      - run: docker compose --profile demo up -d --wait postgresql temporal caddy demo-target

      - run: docker compose run --rm temporal-namespace

      - run: FLUX_REAL_TEMPORAL=1 pnpm --filter @flux/worker --filter @flux/control-plane test

      - run: FLUX_REAL_CADDY=1 pnpm --filter @flux/adapters test

      # The namespace step runs with `run --rm`, so its output is already inline
      # above and it leaves no container to read logs from.
      - name: Temporal logs
        if: failure()
        run: docker compose logs --tail 80 temporal-setup temporal caddy
