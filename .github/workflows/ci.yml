name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run typecheck test

  # Real-cluster proofs: worker versioning, resource tuner, Schedules —
  # the capabilities the time-skipping test server does not implement. Runs the
  # project's own compose so CI exercises exactly what developers run.
  real-temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--wait` blocks until the server's healthcheck passes and both one-shot
      # setup containers have exited 0. It replaces a hand-rolled poll loop that
      # exec'd the `temporal` CLI inside the server container: the
      # `temporalio/server` image ships no CLI, only `temporal-server`.
      - run: docker compose up -d --wait postgresql temporal temporal-namespace

      - run: FLUX_REAL_TEMPORAL=1 pnpm --filter @flux/worker --filter @flux/control-plane test

      - name: Temporal logs
        if: failure()
        run: docker compose logs --tail 80 temporal-setup temporal temporal-namespace
