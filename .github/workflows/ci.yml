name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run typecheck test


  # The images are the only artifacts nothing else in the repo exercises, so
  # they are the only ones that can rot silently. Building them is cheap; the
  # smoke check is what gives it teeth, because it loads every runtime
  # dependency and so covers the two ways these images have actually broken:
  # a dependency left out of the runtime manifest (the app bundle externalises
  # more than `neverBundle`), and a base image whose libc cannot dlopen
  # Temporal's prebuilt core-bridge.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [worker, control-plane]
    steps:
      - uses: actions/checkout@v4

      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t flux-${{ matrix.app }}:ci .

      - name: Runtime dependencies load inside the image
        run: |
          docker run --rm --entrypoint node flux-${{ matrix.app }}:ci --input-type=module -e '
            const fs = await import("node:fs/promises")
            const { dependencies } = JSON.parse(await fs.readFile("/srv/package.json", "utf8"))
            for (const name of Object.keys(dependencies)) await import(name)
            console.log("resolved:", Object.keys(dependencies).join(", "))
          '

  # Real-cluster proofs: worker versioning, resource tuner, Schedules —
  # the capabilities the time-skipping test server does not implement. Runs the
  # project's own compose so CI exercises exactly what developers run.
  real-temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--wait` replaces a hand-rolled poll loop that exec'd the `temporal` CLI
      # inside the server container: the `temporalio/server` image ships no CLI,
      # only `temporal-server`. It must only name long-running services, though
      # — compose treats a named service that exits as a failure even when it
      # exits 0, so listing `temporal-namespace` here fails the job after
      # everything came up correctly. The one-shot runs as its own step instead,
      # where its exit code is the script's own. `run` still honours the
      # `service_healthy` dependency, so ordering is unchanged.
      - run: docker compose up -d --wait postgresql temporal

      - run: docker compose run --rm temporal-namespace

      - run: FLUX_REAL_TEMPORAL=1 pnpm --filter @flux/worker --filter @flux/control-plane test

      # The namespace step runs with `run --rm`, so its output is already inline
      # above and it leaves no container to read logs from.
      - name: Temporal logs
        if: failure()
        run: docker compose logs --tail 80 temporal-setup temporal
