# flux local dev infra.
# PostgreSQL also backs Temporal's advanced visibility (the custom search attributes).
# Prometheus + Jaeger for metrics and traces; a whoami container as the demo target.
#
# Temporal runs as server + admin-tools rather than the old all-in-one
# `temporalio/auto-setup`, which upstream deprecated (its last tag is 1.29.7).
# The two jobs auto-setup did for us — migrate the schema, register the default
# namespace — are now explicit one-shot containers around the server.
name: flux

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema setup, extracted from the retired auto-setup image (see the script).
  # The server waits on this completing, so a cold `up` is still one command.
  temporal-setup:
    image: temporalio/admin-tools:1.31.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: temporal
      # temporal-sql-tool reads the password from this name specifically.
      SQL_PASSWORD: temporal
      DB_PORT: "5432"
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    volumes:
      - ./infra/temporal/scripts:/scripts:ro

  temporal:
    image: temporalio/server:1.31.2
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      # The entrypoint otherwise defaults BIND_ON_IP to the container's own
      # resolved IP, and the server then listens on that address only. The
      # healthcheck below probes `localhost` from inside the container, so it
      # would never go green. (This used to be here for the Nexus callback
      # template, which 1.31 made unnecessary — the healthcheck is the reason
      # now, confirmed by removing it and watching the probe hang.)
      BIND_ON_IP: "0.0.0.0"
      # 1.31 warns that a future version will refuse to start without an
      # authorizer unless this is explicit. Local dev has no auth on purpose.
      TEMPORAL_ALLOW_NO_AUTH: "true"
    ports:
      - "7233:7233"
      - "7243:7243"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    # The server image ships no `temporal` CLI, so readiness is a port check.
    # It says "accepting connections", not "ready for writes" — the namespace
    # container below retries on top of it for that reason.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 60

  # Registers the `default` namespace, then exits. auto-setup did this too.
  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    volumes:
      - ./infra/temporal/scripts:/scripts:ro

  temporal-ui:
    image: temporalio/ui:2.52.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # The browser (not the UI server) calls this endpoint, so it points at
      # the control plane on the host. Gzipped payloads render as JSON again.
      TEMPORAL_CODEC_ENDPOINT: http://localhost:8080/codec
    ports:
      - "8233:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Trace backend: OTLP ingest (:4318) + UI (:16686). flux exports Effect spans here.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  # Minimal deploy target for trying flux locally: whoami answers 200 on any
  # path, so a canary's health check passes (point HEALTH_URL at :8088) and it
  # promotes 10 -> 50 -> 100. Opt-in:  docker compose --profile demo up -d demo-target
  demo-target:
    image: traefik/whoami
    profiles: ["demo"]
    ports:
      - "8088:80"

volumes:
  pgdata:
